[tool.poetry]
name = "smart-document-scanner"
version = "0.1.0"
description = "Intelligent document scanning, perspective correction, and image enhancement system built with OpenCV and Streamlit"
authors = ["Aashish"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
opencv-python-headless = ">=4.8.0"
numpy = ">=1.24.0"
pillow = ">=10.0.0"
streamlit = ">=1.30.0"
reportlab = ">=4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
